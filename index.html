<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прайс HYBRO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  --bg:#F5F5F0;--surface:#FFFFFF;--surface2:#EBEBEB;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --text:#1C1C1E;--text2:#48484A;--text3:#8E8E93;
  --blue:#E6F1FB;--blue-border:#185FA5;--blue-text:#0C447C;
  --green:#00875A;--red:#C0392B;
  --radius:6px;--radius-lg:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo img{height:22px;width:auto}
.container{max-width:640px;margin:0 auto;padding:1.5rem 1rem 4rem}
.section-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:1.25rem 0 .5rem}
.pill-group{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:5px 14px;font-size:13px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text2);cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:all .12s}
.pill:hover{background:var(--surface2)}
.pill.active{background:var(--blue);color:var(--blue-text);border-color:var(--blue-border)}
.line-switch{display:flex;gap:6px}
.line-btn{padding:6px 20px;font-size:13px;font-weight:500;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text2);cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:all .12s}
.line-btn.active{background:var(--blue);color:var(--blue-text);border-color:var(--blue-border)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;margin-bottom:.75rem}
.result-box{background:var(--surface);border:2px solid var(--blue-border);border-radius:var(--radius-lg);padding:1.5rem;text-align:center;margin-top:1.5rem}
.result-label{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.5rem}
.result-product{font-size:14px;color:var(--text2);margin-bottom:.75rem}
.result-price{font-size:36px;font-weight:600;color:var(--text);font-family:'IBM Plex Mono',monospace}
.result-currency{font-size:18px;color:var(--text3);margin-left:4px}
.result-retail{font-size:12px;color:var(--text3);margin-top:.5rem}
.result-discount{font-size:13px;color:var(--green);font-weight:500;margin-top:2px}
.discount-group{display:flex;gap:6px;flex-wrap:wrap}
.disc-btn{padding:6px 12px;font-size:13px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text2);cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:all .12s;position:relative}
.disc-btn:hover{background:var(--surface2)}
.disc-btn.active{background:var(--blue);color:var(--blue-text);border-color:var(--blue-border)}
.disc-btn.popular::after{content:'★';font-size:9px;position:absolute;top:-4px;right:-4px;color:var(--blue-text);background:var(--blue);border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center;line-height:14px}
.empty{font-size:13px;color:var(--text3);text-align:center;padding:2rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}
.qty-btn{width:26px;height:26px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text2);cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qty-btn:hover{background:var(--surface2)}
</style>
</head>

// ── ДАНІ АКСЕСУАРИ ──
const accData = [

const accDiscounts=hybridDiscounts;

// ── СТАН ──
let line='hybrid';
let hModel='375', hColor='W', hThermo=false, hDiscount=null;
let oSize='1L', oGlass='S', oColorW='W', oRail='S', oDiscount=null;
let aType='holder', aModel='SS 300', aDiscount=null;

// ── КОШИК ──
let cart=[];
let cartIdSeq=1;

function currentSelection(){
  if(line==='hybrid'){
    const item=hybridData.find(i=>i.model===hModel&&i.color===hColor&&i.thermo===hThermo);
    if(!item) return null;
    return {name:`HYBRID${hThermo?' T':''} ${hModel} (${hColor})`, retail:item.retail, discount:hDiscount};
  }
  if(line==='hybro'){
    const colorCode=oColorW+oRail;
    const item=hybroData.find(i=>i.size===oSize&&i.glass===oGlass&&i.color===colorCode);
    if(!item) return null;
    const glassPrefix=oGlass==='S'?' S':'';
    return {name:'HYBRO'+glassPrefix+' '+oSize+' '+oColorW+oRail, retail:item.retail, discount:oDiscount};
  }
  if(line==='acc'){
    const item=accData.find(i=>i.type===aType&&i.model===aModel);
    if(!item) return null;
    return {name:`${accNames[aType]} ${aModel}`, retail:item.retail, discount:aDiscount};
  }
  return null;
}

function addToCart(){
  const sel=currentSelection();
  if(!sel) return;
  cart.push({id:cartIdSeq++, name:sel.name, retail:sel.retail, discount:(sel.discount===null?0:sel.discount), qty:1});
  renderCart();
  document.getElementById('cart-section').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function removeFromCart(id){
  cart=cart.filter(i=>i.id!==id);
  renderCart();
}

function setCartDiscount(id,val){
  const item=cart.find(i=>i.id===id);
  if(item) item.discount=val;
  renderCart();
}

function setCartQty(id,qty){
  const item=cart.find(i=>i.id===id);
  if(!item) return;
  qty=Math.max(1,Math.min(999,qty));
  item.qty=qty;
  renderCart();
}

function renderCart(){
  document.getElementById('cart-count').textContent=cart.length;
  document.getElementById('cart-section').style.display=cart.length?'block':'none';
  const wrap=document.getElementById('cart-items');
  wrap.innerHTML=cart.map(item=>{
    const unitPrice=Math.round(item.retail*(1-item.discount));
    const lineTotal=unitPrice*item.qty;
    const discBtns=hybridDiscounts.map(d=>
      `<button class="disc-btn${d.val===item.discount?' active':''}${d.popular?' popular':''}" onclick="setCartDiscount(${item.id},${d.val})">${d.label}</button>`
    ).join('');
    const subLabel=item.qty>1
      ? `${unitPrice.toLocaleString('uk-UA')} ₴ / шт · роздріб ${item.retail.toLocaleString('uk-UA')} ₴`
      : `роздріб ${item.retail.toLocaleString('uk-UA')} ₴`;
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem">
        <div style="font-size:14px;font-weight:500">${item.name}</div>
        <button onclick="removeFromCart(${item.id})" style="border:none;background:none;color:var(--text3);cursor:pointer;font-size:18px;line-height:1;padding:0 2px">×</button>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:.6rem;gap:.5rem;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:.4rem">
          <button class="qty-btn" onclick="setCartQty(${item.id},${item.qty-1})">−</button>
          <span style="min-width:22px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:14px">${item.qty}</span>
          <button class="qty-btn" onclick="setCartQty(${item.id},${item.qty+1})">+</button>
        </div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;text-align:right">${lineTotal.toLocaleString('uk-UA')}<span style="font-size:13px;color:var(--text3);font-weight:400"> ₴</span></div>
      </div>
      <div style="font-size:12px;color:var(--text3);margin-top:2px;text-align:right">${subLabel}</div>
      <div class="discount-group" style="margin-top:.6rem">${discBtns}</div>
    </div>`;
  }).join('');

  const total=cart.reduce((s,i)=>s+Math.round(i.retail*(1-i.discount))*i.qty,0);
  document.getElementById('cart-total').textContent=total.toLocaleString('uk-UA')+' ₴';
  document.getElementById('cart-total-box').style.display=cart.length?'flex':'none';

  const lines=cart.map(i=>{
    const unitPrice=Math.round(i.retail*(1-i.discount));
    const lineTotal=unitPrice*i.qty;
    const qtyPart=i.qty>1?` × ${i.qty}`:'';
    const discPart=i.discount>0?` (-${Math.round(i.discount*100)}%)`:'';
    return `${i.name}${qtyPart} — ${lineTotal.toLocaleString('uk-UA')} ₴${discPart}`;
  });
  if(cart.length) lines.push(`Разом: ${total.toLocaleString('uk-UA')} ₴`);
  document.getElementById('cart-copy-text').value=lines.join('\n');
}

function copyCart(){
  const ta=document.getElementById('cart-copy-text');
  ta.select();
  navigator.clipboard.writeText(ta.value).then(()=>{
    const btn=document.getElementById('cart-copy-btn');
    btn.textContent='Скопійовано ✓';
    btn.style.color='var(--green)';
    setTimeout(()=>{btn.textContent='Копіювати кошик';btn.style.color='';},2000);
  }).catch(()=>{document.execCommand('copy');});
}

function toggleInvoiceForm(){
  const form=document.getElementById('invoice-form');
  const show=form.style.display==='none';
  form.style.display=show?'block':'none';
  if(show && !document.getElementById('inv-date').value){
    const d=new Date();
    const pad=n=>String(n).padStart(2,'0');
    document.getElementById('inv-date').value=`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
  }
}

Надсилаю деталі вашого замовлення та реквізити для оплати за рахунком № ${number} від ${date} р.:
Ваше замовлення:

${itemLines}

Реквізити для оплати:

* Отримувач: ФОП Сушко Владислав Юрійович
* IBAN: \`UA543052990000026003031619772\`
* ІПН / ЄДРПОУ: \`3094810756\`
* Банк: АТ «Приватбанк»
* Сума до сплати: ${total.toLocaleString('uk-UA')} грн
* Призначення платежу: \`Оплата за товар згідно з рах. № ${number} від ${date}\`

Будь ласка, надішліть квитанцію або скриншот оплати у відповідь, щоб ми передали замовлення в комплектацію та доставку. Дякую!`;

function copyInvoice(){
  const ta=document.getElementById('invoice-text');
  ta.select();

    const btn=document.getElementById('invoice-copy-btn');
    btn.textContent='Скопійовано ✓';
    btn.style.color='var(--green)';
    setTimeout(()=>{btn.textContent='Копіювати';btn.style.color='';},2000);
  }).catch(()=>{document.execCommand('copy');});

// ── ІНІЦІАЛІЗАЦІЯ ──
function initHybrid(){
  // Моделі
  const models=['375','420','550'];
  document.getElementById('hybrid-models').innerHTML=models.map(m=>
    `<button class="pill${m===hModel?' active':''}" onclick="setHModel('${m}',this)">${m}</button>`
  ).join('');
  // Термостат
  renderHybridColors();
  // Знижки
  renderDiscounts('hybrid-discounts', hybridDiscounts, hDiscount, 'H');
}

function renderHybridColors(){
  const c=document.getElementById('hybrid-colors');
  c.innerHTML=`
    <button class="pill${hThermo===false?' active':''}" onclick="setHThermo(false,this)">Без термостату</button>
    <button class="pill${hThermo===true?' active':''}" onclick="setHThermo(true,this)">З термостатом</button>
    <button class="pill${hColor==='W'?' active':''}" onclick="setHColor('W',this)">Біла (W)</button>
    <button class="pill${hColor==='B'?' active':''}" onclick="setHColor('B',this)">Чорна (B)</button>`;
}

function initHybro(){
  const sizes=[...new Set(hybroData.map(i=>i.size))];
  document.getElementById('hybro-sizes').innerHTML=sizes.map(s=>
    `<button class="pill${s===oSize?' active':''}" onclick="setOSize('${s}',this)">${s}</button>`
  ).join('');
  renderHybroOptions();
  renderDiscounts('hybro-discounts', hybroDiscounts, oDiscount, 'O');
}

function renderHybroOptions(){
  document.getElementById('hybro-glass').innerHTML=`
    <button class="pill${oGlass==='S'?' active':''}" onclick="setOGlass('S',this)">Сатин</button>
    <button class="pill${oGlass==='G'?' active':''}" onclick="setOGlass('G',this)">Глянець</button>`;
  document.getElementById('hybro-colors').innerHTML=`
    <button class="pill${oColorW==='W'?' active':''}" onclick="setOColor('W',this)">Біле (W)</button>
    <button class="pill${oColorW==='B'?' active':''}" onclick="setOColor('B',this)">Чорне (B)</button>
    <button class="pill${oColorW==='G'?' active':''}" onclick="setOColor('G',this)">Сіре (G)</button>`;
  document.getElementById('hybro-rail').innerHTML=`
    <button class="pill${oRail==='S'?' active':''}" onclick="setORail('S',this)">Сатин (S)</button>
    <button class="pill${oRail==='B'?' active':''}" onclick="setORail('B',this)">Чорний (B)</button>`;
}

function renderDiscounts(id, list, active, prefix){
  document.getElementById(id).innerHTML=list.map(d=>
    `<button class="disc-btn${d.val===active?' active':''}${d.popular?' popular':''}" onclick="setDiscount('${prefix}',${d.val})">${d.label}</button>`
  ).join('');
}

// ── SETTERS HYBRID ──
function setHModel(m,btn){hModel=m;document.querySelectorAll('#hybrid-models .pill').forEach(b=>b.classList.remove('active'));btn.classList.add('active');calcHybrid();}
function setHThermo(v,btn){hThermo=v;document.querySelectorAll('#hybrid-colors .pill').forEach((b,i)=>{if(i<2)b.classList.toggle('active',i===(v?1:0));});calcHybrid();}
function setHColor(c,btn){hColor=c;document.querySelectorAll('#hybrid-colors .pill').forEach((b,i)=>{if(i>=2)b.classList.toggle('active',b.textContent.startsWith(c));});calcHybrid();}

// ── SETTERS HYBRO ──
function setOSize(s,btn){oSize=s;document.querySelectorAll('#hybro-sizes .pill').forEach(b=>b.classList.remove('active'));btn.classList.add('active');calcHybro();}
function setOGlass(g,btn){oGlass=g;document.querySelectorAll('#hybro-glass .pill').forEach(b=>b.classList.remove('active'));btn.classList.add('active');calcHybro();}
function setOColor(c,btn){oColorW=c;document.querySelectorAll('#hybro-colors .pill').forEach(b=>b.classList.remove('active'));btn.classList.add('active');calcHybro();}
function setORail(r,btn){oRail=r;document.querySelectorAll('#hybro-rail .pill').forEach(b=>b.classList.remove('active'));btn.classList.add('active');calcHybro();}

// ── АКСЕСУАРИ ──
function initAcc(){
  document.getElementById('acc-types').innerHTML=`
    <button class="pill${aType==='holder'?' active':''}" onclick="setAType('holder',this)">Тримач</button>
    <button class="pill${aType==='hook'?' active':''}" onclick="setAType('hook',this)">Гачок</button>`;
  renderAccModels();
  renderDiscounts('acc-discounts', accDiscounts, aDiscount, 'A');
}

function renderAccModels(){
  const models=accData.filter(i=>i.type===aType).map(i=>i.model);
  if(!models.includes(aModel)) aModel=models[0];
  document.getElementById('acc-models').innerHTML=models.map(m=>
    `<button class="pill${m===aModel?' active':''}" onclick="setAModel('${m}',this)">${m}</button>`
  ).join('');
}

function setAType(t,btn){aType=t;document.querySelectorAll('#acc-types .pill').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderAccModels();calcAcc();}
function setAModel(m,btn){aModel=m;document.querySelectorAll('#acc-models .pill').forEach(b=>b.classList.remove('active'));btn.classList.add('active');calcAcc();}

function calcAcc(){
  const item=accData.find(i=>i.type===aType&&i.model===aModel);
  if(!item||aDiscount===null){hideResult();return;}
  const price=Math.round(item.retail*(1-aDiscount));
  const name=`${accNames[aType]} ${aModel}`;
  showResult(name, price, item.retail, aDiscount);
}

function setDiscount(prefix, val){
  if(prefix==='H'){hDiscount=val;renderDiscounts('hybrid-discounts',hybridDiscounts,hDiscount,'H');calcHybrid();}
  else if(prefix==='A'){aDiscount=val;renderDiscounts('acc-discounts',accDiscounts,aDiscount,'A');calcAcc();}
  else{oDiscount=val;renderDiscounts('hybro-discounts',hybroDiscounts,oDiscount,'O');calcHybro();}
}

// ── CALC ──
function calcHybrid(){
  const item=hybridData.find(i=>i.model===hModel&&i.color===hColor&&i.thermo===hThermo);
  if(!item||hDiscount===null){hideResult();return;}
  const price=Math.round(item.retail*(1-hDiscount));
  const name=`HYBRID${hThermo?' T':''} ${hModel} (${hColor})`;
  showResult(name, price, item.retail, hDiscount);
}

function calcHybro(){
  const colorCode=oColorW+oRail;
  const item=hybroData.find(i=>i.size===oSize&&i.glass===oGlass&&i.color===colorCode);
  if(!item||oDiscount===null){hideResult();return;}
  const price=Math.round(item.retail*(1-oDiscount));
  // HYBRO [S якщо сатин] [модель] [колір][рейлінг]
  const glassPrefix=oGlass==='S'?' S':'';
  const name='HYBRO'+glassPrefix+' '+oSize+' '+oColorW+oRail;
  showResult(name, price, item.retail, oDiscount);
}

function showResult(name, price, retail, discount){
  document.getElementById('result-box').style.display='block';
  document.getElementById('result-product').textContent=name;
  document.getElementById('result-price').textContent=price.toLocaleString('uk-UA');
  const isRetail = discount===0;
  document.getElementById('result-retail').textContent=isRetail?'Роздрібна ціна':`Роздріб: ${retail.toLocaleString('uk-UA')} ₴`;
  const saved=retail-price;
  document.getElementById('result-discount').textContent=isRetail?'':(`Знижка ${Math.round(discount*100)}% — економія ${saved.toLocaleString('uk-UA')} ₴`);
  const discLabel=isRetail?'роздріб':`-${Math.round(discount*100)}%`;
  document.getElementById('copy-text').value=`${name} — ${price.toLocaleString('uk-UA')} ₴ (${discLabel})`;
}

function copyText(){
  const ta=document.getElementById('copy-text');
  ta.select();
  navigator.clipboard.writeText(ta.value).then(()=>{
    const btn=document.getElementById('copy-btn');
    btn.textContent='Скопійовано ✓';
    btn.style.color='var(--green)';
    setTimeout(()=>{btn.textContent='Копіювати';btn.style.color='';},2000);
  }).catch(()=>{document.execCommand('copy');});
}

function hideResult(){document.getElementById('result-box').style.display='none';}

function setLine(l,btn){
  line=l;
  document.querySelectorAll('.line-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('section-hybrid').style.display=l==='hybrid'?'block':'none';
  document.getElementById('section-hybro').style.display=l==='hybro'?'block':'none';
  document.getElementById('section-acc').style.display=l==='acc'?'block':'none';
  hideResult();
  if(l==='hybro') initHybro();
  if(l==='acc') initAcc();
}

// Логотип
(function(){
  fetch('/mnt/user-data/uploads/Logo_HYBRO_.png').catch(()=>{});
})();

initHybrid();
initHybro();
initAcc();
</script>
